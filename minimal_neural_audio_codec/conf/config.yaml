model:
  verbose: false

data:
  dataset:
    games_genres: /app/dataset/deepseek_genres.csv
    path: /app/dataset/nintendo-snes-spc

  data_loader:
    batch_size: 64
    num_workers: 4

train:
  num_epochs: 100
  iters_per_epoch: 450
  eval_iters: 50
  test_iters: 50
  lr: 1e-4
  weight_decay: 1e-2
  save_model_path: './checkpoints/best_model.pth'
  tensorboard_path: './tensorboard'